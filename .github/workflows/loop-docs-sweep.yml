name: "loop: docs-sweep (L0)"

# An autonomous, recurring L0 loop (the unattended/ops lane). It OBSERVES docs
# drift and reports — it never edits files. Manual runs are pure dry-runs (report
# to the run summary only); scheduled runs also maintain one tracking issue.
# Kill switch: disable this workflow in the Actions tab.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {} # manual dry-run

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-docs-sweep
  cancel-in-progress: false

jobs:
  docs-sweep:
    name: Scan docs drift (report-only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for commit dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        id: scan
        env:
          LOOP_REPORT_FILE: docs-sweep-report.md
        run: bash scripts/loop-docs-sweep.sh

      - name: Maintain tracking issue (scheduled runs only)
        if: github.event_name == 'schedule' && steps.scan.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="📋 Docs drift report (loop:docs-sweep)"
          num=$(gh issue list --state open --search "$title in:title" \
                  --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file docs-sweep-report.md
            echo "Updated tracking issue #$num"
          else
            gh issue create --title "$title" --body-file docs-sweep-report.md
            echo "Opened tracking issue"
          fi
