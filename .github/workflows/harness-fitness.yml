name: Harness Fitness

# Mechanical enforcement of static harness invariants. The harness's operating
# rules live in markdown, but structural compliance is checked here so a
# violation blocks the PR instead of relying on an agent reading the prose.
#
# This gates repository structure. Durable-layer drift/entropy is analysed by
# `harness-cli audit`, run informationally below when a CLI binary is present.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/harness-fitness.yml"
  workflow_dispatch:

jobs:
  fitness:
    name: Harness fitness checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static harness invariants (gate)
        run: bash scripts/harness-fitness.sh

      - name: Durable-layer entropy gate
        run: |
          if [ -x scripts/bin/harness-cli ]; then
            # Real gate: fail when durable-layer entropy exceeds the ceiling.
            # Tune the ceiling per project with the HARNESS_MAX_ENTROPY env var.
            scripts/bin/harness-cli audit --max-entropy "${HARNESS_MAX_ENTROPY:-100}"
            scripts/bin/harness-cli propose || true
          else
            echo "harness-cli not present in checkout — skipping durable-layer gate."
            echo "(audit --max-entropy / propose run where the prebuilt CLI is installed.)"
          fi
